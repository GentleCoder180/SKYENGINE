name: CrazyGames Release Build Check

on:
  push:
    paths:
      - "crazygames-build/**"
      - ".github/workflows/crazygames-build-check.yml"
  pull_request:
    paths:
      - "crazygames-build/**"
      - ".github/workflows/crazygames-build-check.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release build
        run: node crazygames-build/validate.mjs
