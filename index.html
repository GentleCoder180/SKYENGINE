
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyEngine</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #07152d, #102c55, #07152d);
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 650px;
  text-align: center;
}

.logo {
  font-size: 55px;
  font-weight: 900;
  letter-spacing: -3px;
  margin-bottom: 10px;
}

.logo span {
  color: #38bdf8;
}

.subtitle {
  color: #b8c9df;
  margin-bottom: 35px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
}

.tab {
  background: #18375e;
  border: 1px solid #31577e;
  color: white;
  padding: 12px 22px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 15px;
}

.tab.active {
  background: #168bd0;
  border-color: #38bdf8;
}

.search-box {
  display: flex;
  background: white;
  padding: 7px;
  border-radius: 35px;
  box-shadow: 0 10px 35px #0006;
}

input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 15px;
  font-size: 16px;
  border-radius: 30px;
}

.search-button {
  border: none;
  border-radius: 30px;
  padding: 0 22px;
  background: #168bd0;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.search-button:hover {
  background: #0872b5;
}

.hint {
  color: #9fb4ce;
  font-size: 13px;
  margin-top: 22px;
}

.footer {
  margin-top: 70px;
  color: #8198b5;
  font-size: 12px;
}
</style>
</head>

<body>
<div class="container">

  <div class="logo">Sky<span>Engine</span></div>
  <div class="subtitle">Explore the web your way.</div>

  <div class="tabs">
    <button class="tab active" id="webTab"
      onclick="setMode('web')">🌐 Web</button>

    <button class="tab" id="youtubeTab"
      onclick="setMode('youtube')">▶ YouTube</button>
  </div>

  <form class="search-box" onsubmit="search(event)">
    <input
      id="query"
      type="search"
      placeholder="Search the web..."
      autocomplete="off"
      required
    >

    <button class="search-button" type="submit">
      Search
    </button>
  </form>

  <div class="hint" id="hint">
    Search websites with SkyEngine.
  </div>

  <div class="footer">
    SKYENGINE • YOUR SEARCH STARTS HERE
  </div>

</div>

<script>
let mode = "web";

function setMode(newMode) {
  mode = newMode;

  document.getElementById("webTab")
    .classList.toggle("active", mode === "web");

  document.getElementById("youtubeTab")
    .classList.toggle("active", mode === "youtube");

  document.getElementById("query").placeholder =
    mode === "web"
      ? "Search the web..."
      : "Search YouTube videos...";

  document.getElementById("hint").textContent =
    mode === "web"
      ? "Search websites with SkyEngine."
      : "Find videos on YouTube.";
}

function search(event) {
  event.preventDefault();

  const query = document
    .getElementById("query")
    .value.trim();

  if (!query) return;

  const encoded = encodeURIComponent(query);

  const url = mode === "web"
    ? "https://duckduckgo.com/?q=" + encoded
    : "https://www.youtube.com/results?search_query=" + encoded;

  window.open(url, "_blank", "noopener,noreferrer");
}
</script>
</body>
</html>
