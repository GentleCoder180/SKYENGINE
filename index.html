
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYENGINE</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(circle at 50% 20%, #174d83, transparent 50%),
    linear-gradient(135deg, #070d20, #101a36, #080d1c);
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 35px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #62c5ff;
}

.status {
  color: #9bb5d5;
  font-size: 13px;
}

main {
  width: 90%;
  max-width: 750px;
  margin: auto;
  text-align: center;
  padding: 50px 0;
}

.planet {
  font-size: 55px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-12px); }
}

h1 {
  font-size: clamp(42px, 9vw, 70px);
  letter-spacing: 4px;
  margin: 15px 0;
  text-shadow: 0 0 30px #289cff70;
}

h1 span {
  color: #55bdff;
}

.subtitle {
  color: #a8bddb;
  margin-bottom: 38px;
  font-size: 16px;
}

.searchbox {
  display: flex;
  padding: 8px;
  border-radius: 50px;
  background: white;
  box-shadow: 0 0 35px #168cff55;
  transition: .3s;
}

.searchbox:focus-within {
  box-shadow: 0 0 50px #168cffaa;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border: none;
  outline: none;
  font-size: 16px;
  color: #111;
  border-radius: 50px;
}

.searchbox button {
  background: #168cff;
  color: white;
  border: none;
  padding: 0 24px;
  border-radius: 40px;
  font-weight: bold;
  cursor: pointer;
}

.shortcuts {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 30px;
}

.shortcut {
  color: white;
  padding: 13px 18px;
  background: #ffffff12;
  border: 1px solid #ffffff30;
  border-radius: 30px;
  cursor: pointer;
  transition: .2s;
}

.shortcut:hover {
  background: #168cff;
  transform: translateY(-4px);
}

.youtube {
  background: #c91e2b;
  border-color: #c91e2b;
}

.section {
  margin-top: 65px;
  color: #8ca7c8;
  font-size: 13px;
  letter-spacing: 2px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #728aa9;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">☁ SKYENGINE</div>
  <div class="status">● ONLINE</div>
</header>

<main>

  <div class="planet">🌌</div>

  <h1>SKY<span>ENGINE</span></h1>

  <p class="subtitle">
    Search Beyond Limits.
  </p>

  <form class="searchbox"
        action="https://www.google.com/search"
        method="GET">

    <input
      type="search"
      name="q"
      placeholder="Explore the internet..."
      autocomplete="off"
      required>

    <button type="submit">
      🔍 SEARCH
    </button>

  </form>

  <div class="shortcuts">

    <button class="shortcut"
      onclick="openSite('https://www.google.com')">
      🔍 Google
    </button>

    <button class="shortcut youtube"
      onclick="openSite('https://www.youtube.com')">
      ▶ YouTube
    </button>

    <button class="shortcut"
      onclick="openSite('https://www.wikipedia.org')">
      📚 Wikipedia
    </button>

    <button class="shortcut"
      onclick="openSite('https://www.dictionary.com')">
      📖 Dictionary
    </button>

    <button class="shortcut"
      onclick="openSite('https://www.coolmathgames.com')">
      🎮 Games
    </button>

  </div>

  <div class="section">
    YOUR GATEWAY TO THE INTERNET 🚀
  </div>

</main>

<footer>
  © 2026 SKYENGINE
</footer>

<script>
function openSite(url) {
  window.open(url, "_blank", "noopener");
}
</script>

</body>
</html>
